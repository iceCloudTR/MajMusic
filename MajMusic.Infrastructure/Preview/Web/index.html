<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>MajView · MajMusic</title>
    <style>
        :root { color-scheme: dark; font: 14px system-ui,sans-serif; background:#17171b; color:#f1f1f5 }
        html, body { margin:0; height:100%; overflow:hidden; }
        main { height:100%; position:relative; display:grid; place-items:center; isolation:isolate; overflow:hidden; }
        canvas { display:block; background:#000; width:100vmin; height:100vmin; opacity:0; }
        canvas.entered { opacity:1; animation:arrive 220ms cubic-bezier(.22,.7,.26,1) both; }
        canvas.entered.reverse { --entry-offset:-10px; }
        canvas.entered.no-motion { animation:none; }
        @keyframes arrive { from { opacity:0; transform:translateX(var(--entry-offset,10px)); } to { opacity:1; transform:translateX(0); } }
        @media (prefers-reduced-motion:reduce) { canvas.entered { animation:none; } }
        [hidden] { display:none !important; }
        p { position:absolute; text-align:center; margin:0; color:#c5c5ce; pointer-events:none; }
    </style>
    <script defer src="runtime/Build.loader.js"></script>
    <script defer src="preview.js"></script>
</head>
<body>
    <main>
        <canvas id="viewer" width="800" height="800" tabindex="-1"></canvas>
        <p id="status" role="status">正在加载 MajView</p>
    </main>
</body>
</html>
