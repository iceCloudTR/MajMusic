<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>MajView · MajMusic</title>
    <style>
        :root { color-scheme: dark; font: 14px system-ui,sans-serif; background:#17171b; color:#f1f1f5 }
        html, body { margin:0; height:100%; overflow:hidden; }
        main { height:100%; box-sizing:border-box; padding:4px 6px 6px; display:grid; grid-template-rows:auto minmax(0,1fr); gap:6px; }
        header { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; gap:6px; }
        label { display:flex; gap:6px; align-items:center; }
        button, select, input, summary { font:inherit; color:inherit; background:#2b2b34; border:1px solid #474752; border-radius:8px; min-height:36px; padding:0 8px; }
        .stage { position:relative; display:grid; place-items:center; container-type:size; overflow:hidden; }
        canvas { display:block; background:#000; border-radius:8px; width:100%; max-width:100%; max-height:100%; aspect-ratio:1; }
        @supports (width: 1cqh) { canvas { width:min(100cqw, 100cqh); height:min(100cqw, 100cqh); } }
        canvas[hidden] { display:none; }
        p { position:absolute; text-align:center; margin:0; color:#c5c5ce; pointer-events:none; }
        summary { cursor:pointer; box-sizing:border-box; line-height:34px; white-space:nowrap; }
        form { position:absolute; top:calc(100% + 4px); right:0; margin:0; width:min(340px, 100%); max-height:calc(100vh - 54px); box-sizing:border-box; overflow:auto; padding:10px; background:#222228; border:1px solid #474752; border-radius:10px; }
        .settings-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(128px,1fr)); gap:6px 10px; margin:0 0 8px; }
        .settings-grid label { justify-content:space-between; }
        .settings-grid input { width:68px; box-sizing:border-box; }
    </style>
    <script defer src="runtime/Build.loader.js"></script>
    <script defer src="preview.js"></script>
</head>
<body>
    <main>
        <header>
            <label>难度 <select id="difficulty" disabled aria-label="难度"></select></label>
            <details id="options">
                <summary>流速与音效</summary>
                <form id="settings">
                    <div class="settings-grid" id="setting-fields"></div>
                    <button id="apply-settings" type="submit" disabled>应用并重新加载</button>
                </form>
            </details>
        </header>
        <div class="stage">
            <canvas id="viewer" width="800" height="800" tabindex="-1"></canvas>
            <p id="status" role="status">正在加载 MajView</p>
        </div>
    </main>
</body>
</html>
