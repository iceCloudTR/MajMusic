<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>MajView · MajMusic</title>
    <style>
        :root { color-scheme: dark; font: 14px system-ui,sans-serif; background:#17171b; color:#f1f1f5 }
        html, body { margin:0; height:100%; overflow:hidden; }
        main { height:100%; position:relative; display:grid; place-items:center; isolation:isolate; overflow:hidden; }
        label { display:flex; gap:6px; align-items:center; }
        button, input, summary { font:inherit; color:inherit; background:#2b2b34; border:1px solid #474752; border-radius:8px; min-height:36px; padding:0 8px; }
        canvas { display:block; background:#000; width:100vmin; height:100vmin; opacity:0; }
        canvas.entered { opacity:1; animation:arrive 220ms cubic-bezier(.22,.7,.26,1) both; }
        canvas.entered.reverse { --entry-offset:-10px; }
        canvas.entered.no-motion { animation:none; }
        @keyframes arrive { from { opacity:0; transform:translateX(var(--entry-offset,10px)); } to { opacity:1; transform:translateX(0); } }
        @media (prefers-reduced-motion:reduce) { canvas.entered { animation:none; } }
        [hidden] { display:none !important; }
        p { position:absolute; text-align:center; margin:0; color:#c5c5ce; pointer-events:none; }
        details { position:absolute; z-index:1; top:6px; left:6px; }
        summary { cursor:pointer; list-style:none; padding:0; min-height:0; width:36px; height:36px; display:grid; place-items:center; background:#202027db; }
        summary::-webkit-details-marker { display:none; }
        summary:hover, details[open] summary { background:#34343e; }
        summary svg { width:19px; height:19px; }
        form { position:absolute; top:calc(100% + 5px); left:0; margin:0; width:min(340px, calc(100vw - 12px)); max-height:calc(100vh - 55px); box-sizing:border-box; overflow:auto; padding:10px; background:#222228; border:1px solid #474752; border-radius:10px; }
        .settings-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(128px,1fr)); gap:6px 10px; margin:0 0 8px; }
        .settings-grid label { justify-content:space-between; }
        .settings-grid input { width:68px; box-sizing:border-box; }
        .video-option { margin:0 0 8px; }
        .video-option input { margin:0; min-height:0; }
    </style>
    <script defer src="runtime/Build.loader.js"></script>
    <script defer src="preview.js"></script>
</head>
<body>
    <main>
        <canvas id="viewer" width="800" height="800" tabindex="-1"></canvas>
        <p id="status" role="status">正在加载 MajView</p>
        <details id="options" hidden>
            <summary aria-label="流速与音效" title="流速与音效">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9.8 3h4.4l.56 2.08 1.14.66L18 5.2l2.2 3.8-1.55 1.53v1.36L20.2 13.4 18 17.2l-2.1-.55-1.14.66-.56 2.09H9.8l-.56-2.09-1.14-.66-2.1.55-2.2-3.8 1.55-1.51v-1.36L3.8 9 6 5.2l2.1.54 1.14-.66z"/>
                    <circle cx="12" cy="11.2" r="2.8"/>
                </svg>
            </summary>
            <form id="settings">
                <label id="video-option" class="video-option" hidden>
                    <input id="show-video" type="checkbox" checked /> 背景 PV
                </label>
                <div class="settings-grid" id="setting-fields"></div>
                <button id="apply-settings" type="submit" disabled>应用并重新加载</button>
            </form>
        </details>
    </main>
</body>
</html>
