<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>MajView · MajMusic</title>
    <style>
        :root { color-scheme: dark; font: 15px system-ui,sans-serif; background:#17171b; color:#f1f1f5 }
        body { margin:0; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
        main { margin:auto; max-width:min(820px, 100%); }
        header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
        h1 { font-size:16px; flex:1; margin:0; overflow-wrap:anywhere; }
        label { display:flex; gap:6px; align-items:center; }
        button, select, input { font:inherit; color:inherit; background:#2b2b34; border:1px solid #474752; border-radius:8px; min-height:40px; padding:0 10px; }
        canvas { display:block; background:#000; border-radius:12px; width:min(100%, 80dvh); margin:auto; aspect-ratio:1; }
        canvas[hidden] { display:none; }
        p { text-align:center; margin:8px 0; color:#c5c5ce; }
        details { padding:10px; background:#222228; border-radius:10px; margin:8px 0; }
        summary { cursor:pointer; padding:5px; }
        .settings-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(165px,1fr)); gap:8px 14px; margin:10px 0; }
        .settings-grid label { justify-content:space-between; }
        .settings-grid input { width:68px; box-sizing:border-box; }
    </style>
    <script defer src="runtime/Build.loader.js"></script>
    <script defer src="preview.js"></script>
</head>
<body>
    <main>
        <header>
            <h1 id="title">MajView</h1>
            <label>难度 <select id="difficulty" disabled aria-label="难度"></select></label>
            <button id="close" type="button">关闭</button>
        </header>
        <canvas id="viewer" width="800" height="800" tabindex="-1"></canvas>
        <p id="status" role="status">正在加载 MajView</p>
        <details id="options">
            <summary>流速与音效</summary>
            <form id="settings">
                <div class="settings-grid" id="setting-fields"></div>
                <button id="apply-settings" type="submit" disabled>应用并重新加载</button>
            </form>
        </details>
    </main>
</body>
</html>
